name: 每日稀有鳥推播
on:
  schedule:
    - cron: "17 13 * * *"   # 每天 UTC 13:17 = 鳳凰城早上 6:17
  workflow_dispatch:         # 也可以在 Actions 頁面手動按「Run workflow」
permissions:
  contents: write
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 notify.py
        env:
          EBIRD_KEY: ${{ secrets.EBIRD_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: 記住已推播過的紀錄
        run: |
          git config user.name "rare-bird-bot"
          git config user.email "actions@users.noreply.github.com"
          git add notified.json
          git diff --cached --quiet || (git commit -m "更新已推播紀錄" && git push)
